[project]
name = "walking-information-storage-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.95",
    "fastapi>=0.115.6",
    "numpy>=2.2.1",
    "opencv-python>=4.10.0.84",
    "pandas>=2.2.3",
    "pillow>=11.1.0",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.20",
    "python-ulid>=3.0.0",
    "scikit-learn>=1.6.0",
    "sqlfluff>=3.3.0",
    "uvicorn>=0.34.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1",      # undocumented
    "D203",    # one blank line before class
    "D213",    # multi-line summary second line
    "PD011",   # pandas use of dot values
    "D415",    # first line should end with a period
    "D400",    # first line should end with a period
    "ISC001",  # invalid issue tag
    "COM812",  # missing space after comment hash
    "PLR0913", # too many blank lines before class
    "TRY301",  # try-except block improvement
    "FBT001",  # invalid format
]
unfixable = [
    "F401", # unused import
    "F841", # unused variable
    
]

[tool.ruff.lint.pylint]
max-args = 4

[dependency-groups]
dev = [
    "ruff>=0.9.1",
]
